[tool.poetry]
package-mode = true
name = "example"
version = "0.1.0"
description = ""
authors = ["Felix Hammerl <felix.hammerl@gmail.com>"]
readme = "README.md"
packages = [
    { include = "example" },
]
exclude = [
    ".*",
    "*.pyc",
    "__pycache__",
    "dist",
    "build",
    "tests",
    "Makefile",
    "README.md",
]

[tool.poetry.dependencies]
python = "^3.12"
aws-lambda-powertools = "^3.7.0"
dacite = "^1.9.2"
python-json-logger = "^3.2.1"
structlog = "^25.1.0"
requests = "^2.32.3"

[tool.poetry.group.dev.dependencies]
boto3 = "^1.37.7"
boto3-stubs = {version = "^1.37.7", extras = ["full"]}
pre-commit = "^4.1.0"
pytest = "^8.3.5"
pytest-mock = "^3.14.0"
moto = "^5.1.1"
pyhamcrest = "^2.1.0"
black = "^25.1.0"
matchmock = "^2.1.1"
pudb = "^2024.1.3"
pytest-pudb = "^0.7.0"
isort = "^6.0.1"
docformatter = "^1.7.5"
autoflake = "^2.3.1"
bandit = "^1.8.3"
pylint = "^3.3.4"
poethepoet = "^0.33.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
include = '\.pyi?$'

[tool.isort]
profile = "black"

[tool.docformatter]
in-place = true
black = true
recursive = true

[tool.pylint.options]
max-line-length = 120
disable = "useless-object-inheritance"

[tool.pytest.ini_options]
addopts = "-p no:warnings"
